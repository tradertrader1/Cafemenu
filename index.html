<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'sb_publishable_LDMY3a2X3LCBlfbXM3qhQg_gD3CGCPM';
const SUPABASE_ANON_KEY = 'sb_secret_Fhq4McQwkF7X9U6Gj8R1Hw_CV5TYVKY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const KEY = 'greenTableCafeSettings_v1';
let foods = [];
let settings = loadSettings();
let password = localStorage.getItem('cafePassword') || 'cafe123';

let activeCategory = 'All', loggedIn = false, qrImage = '', menuView = localStorage.getItem('cafeMenuView') || 'grid', selectedFoodImage = '';

function loadSettings() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || { name: 'Green Table Cafe', tagline: 'Explore our menu and find your next favourite.' };
  } catch (e) {
    return { name: 'Green Table Cafe', tagline: 'Explore our menu and find your next favourite.' };
  }
}
function persistSettings() { localStorage.setItem(KEY, JSON.stringify(settings)); }

// Fetch foods from Supabase on load
async function fetchFoods() {
  try {
    const { data, error } = await supabase.from('foods').select('*');
    if (error) {
      console.error('Error fetching foods from Supabase:', error);
    } else {
      foods = data || [];
    }
  } catch (err) {
    console.error('Unexpected error connecting to Supabase:', err);
  } finally {
    // Re-render whichever page is active after network call resolves
    if (document.getElementById('adminPage').classList.contains('hidden')) {
      renderMenu();
    } else if (loggedIn) {
      renderAdmin();
    }
  }
}

function safe(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showPage(p) {
  const menuPage = document.getElementById('menuPage');
  const adminPage = document.getElementById('adminPage');
  const menuTab = document.getElementById('menuTab');
  const adminTab = document.getElementById('adminTab');

  if (p === 'menu') {
    menuPage.classList.remove('hidden');
    adminPage.classList.add('hidden');
    menuTab.classList.add('active');
    adminTab.classList.remove('active');
    renderMenu();
  } else if (p === 'admin') {
    adminPage.classList.remove('hidden');
    menuPage.classList.add('hidden');
    adminTab.classList.add('active');
    menuTab.classList.remove('active');
    if (loggedIn) renderAdmin();
  }
}

function openAdmin() {
  showPage('admin');
  if (!loggedIn) {
    document.getElementById('loginPanel').classList.remove('hidden');
    document.getElementById('adminContent').classList.add('hidden');
  }
}

function login() {
  if (document.getElementById('loginUser').value.trim() === 'admin' && document.getElementById('loginPass').value === password) {
    loggedIn = true;
    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    document.getElementById('loginError').textContent = '';
    renderAdmin();
  } else {
    document.getElementById('loginError').textContent = 'Incorrect username or password.';
  }
}

function logout() {
  loggedIn = false;
  document.getElementById('adminContent').classList.add('hidden');
  document.getElementById('loginPanel').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('loginPass').value = '';
}

function setMenuView(view) { menuView = view; localStorage.setItem('cafeMenuView', view); renderMenu(); }
function normalizeCategory(value) { return String(value || '').trim().toLowerCase(); }

function renderMenu() {
  const grid = document.getElementById('foodGrid');
  if (!grid) return;
  
  grid.classList.toggle('list-view', menuView === 'list');
  document.getElementById('gridViewBtn').classList.toggle('primary', menuView === 'grid');
  document.getElementById('gridViewBtn').classList.toggle('secondary', menuView !== 'grid');
  document.getElementById('listViewBtn').classList.toggle('primary', menuView === 'list');
  document.getElementById('listViewBtn').classList.toggle('secondary', menuView !== 'list');
  
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const standardCats = ['Coffee', 'Snacks', 'Lunch', 'Drinks', 'Breakfast', 'Dinner', 'Desserts'];
  const usedCats = foods.map(x => String(x.category || '').trim()).filter(Boolean);
  const cats = ['All', ...new Set([...standardCats, ...usedCats])];
  
  document.getElementById('categories').innerHTML = cats.map(c => `<button class="chip ${normalizeCategory(activeCategory) === normalizeCategory(c) ? 'active' : ''}" onclick="selectCategory(${JSON.stringify(c)})">${safe(c)}</button>`).join('');
  
  const list = foods.filter(x => {
    const categoryMatches = normalizeCategory(activeCategory) === 'all' || normalizeCategory(x.category) === normalizeCategory(activeCategory);
    const searchMatches = `${x.name || ''} ${x.description || ''} ${x.category || ''}`.toLowerCase().includes(q);
    return categoryMatches && searchMatches;
  });
  
  document.getElementById('itemCount').textContent = `${list.length} items`;
  grid.innerHTML = list.length ? list.map(x => `<article class="food"><img src="${safe(x.image || '')}" alt="${safe(x.name)}" onerror="this.src='https://placehold.co/600x400/f0eee6/245b49?text=Food+Photo'"><div class="body"><h3>${safe(x.name)}</h3><p>${safe(x.description)}</p><div class="food-foot"><span class="price">${Number(x.price).toLocaleString()} ETB</span>${x.available ? '<span class="muted">Available</span>' : '<span class="unavailable">Unavailable</span>'}</div></div></article>`).join('') : '<div class="empty" style="grid-column:1/-1">No menu items found in this category.</div>';
}

function selectCategory(category) { activeCategory = category; renderMenu(); }

function previewFoodImage(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please select an image file.'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    selectedFoodImage = String(reader.result);
    const preview = document.getElementById('foodImagePreview');
    preview.src = selectedFoodImage;
    preview.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function resetForm() {
  ['editId', 'foodName', 'foodDescription', 'foodPrice', 'foodImage'].forEach(id => document.getElementById(id).value = '');
  selectedFoodImage = '';
  document.getElementById('foodImageFile').value = '';
  document.getElementById('foodImagePreview').src = '';
  document.getElementById('foodImagePreview').classList.add('hidden');
  document.getElementById('foodCategory').value = 'Breakfast';
  document.getElementById('foodAvailable').checked = true;
  document.getElementById('formTitle').textContent = 'Add menu item';
}

async function saveFood() {
  const name = document.getElementById('foodName').value.trim();
  const price = Number(document.getElementById('foodPrice').value);
  if (!name || document.getElementById('foodPrice').value === '' || !Number.isFinite(price) || price < 0) {
    alert('Please enter a food name and a valid price.');
    return;
  }
  const editId = document.getElementById('editId').value;
  const existingItem = foods.find(x => x.id == editId);
  
  const itemData = {
    name,
    category: document.getElementById('foodCategory').value.trim(),
    description: document.getElementById('foodDescription').value.trim(),
    price,
    image: selectedFoodImage || document.getElementById('foodImage').value.trim() || (existingItem?.image || ''),
    available: document.getElementById('foodAvailable').checked
  };

  if (editId) {
    const { error } = await supabase.from('foods').update(itemData).eq('id', editId);
    if (error) { alert('Error updating item: ' + error.message); return; }
  } else {
    const { error } = await supabase.from('foods').insert([itemData]);
    if (error) { alert('Error adding item: ' + error.message); return; }
  }

  resetForm();
  await fetchFoods();
  alert('Menu item saved successfully.');
}

function editFood(id) {
  const x = foods.find(x => x.id == id);
  if (!x) return;
  document.getElementById('editId').value = x.id;
  document.getElementById('foodName').value = x.name;
  document.getElementById('foodCategory').value = x.category;
  document.getElementById('foodDescription').value = x.description;
  document.getElementById('foodPrice').value = x.price;
  document.getElementById('foodImage').value = (x.image || '').startsWith('data:') ? '' : (x.image || '');
  selectedFoodImage = (x.image || '').startsWith('data:') ? x.image : '';
  const preview = document.getElementById('foodImagePreview');
  if (x.image) { preview.src = x.image; preview.classList.remove('hidden'); } else { preview.src = ''; preview.classList.add('hidden'); }
  document.getElementById('foodImageFile').value = '';
  document.getElementById('foodAvailable').checked = x.available;
  document.getElementById('formTitle').textContent = 'Edit menu item';
  document.getElementById('foodName').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function deleteFood(id) {
  if (confirm('Delete this menu item?')) {
    const { error } = await supabase.from('foods').delete().eq('id', id);
    if (error) { alert('Error deleting item: ' + error.message); return; }
    await fetchFoods();
  }
}

function renderAdmin() {
  document.getElementById('adminCount').textContent = foods.length + ' items';
  document.getElementById('adminItems').innerHTML = foods.length ? foods.map(x => `<div class="item-row"><img src="${safe(x.image || 'https://placehold.co/100x100')}" onerror="this.src='https://placehold.co/100x100'"><div class="grow"><strong>${safe(x.name)}</strong><small>${safe(x.category)} · ${Number(x.price).toLocaleString()} ETB · ${x.available ? 'Available' : 'Unavailable'}</small></div><button class="secondary" onclick="editFood('${safe(x.id)}')">Edit</button><button class="danger" onclick="deleteFood('${safe(x.id)}')">Delete</button></div>`).join('') : '<p class="muted">No menu items yet. Add your first item.</p>';
  document.getElementById('cafeNameInput').value = settings.name;
  document.getElementById('taglineInput').value = settings.tagline;
  makeQR();
}

function saveSettings() {
  settings.name = document.getElementById('cafeNameInput').value.trim() || 'My Cafe';
  settings.tagline = document.getElementById('taglineInput').value.trim();
  persistSettings();
  updateBrand();
  renderAdmin();
  alert('Cafe details saved.');
}

function updateBrand() {
  document.getElementById('brandName').textContent = settings.name;
  document.getElementById('footerName').textContent = settings.name;
  document.getElementById('heroSubtitle').textContent = settings.tagline;
}

function changePassword() {
  if (document.getElementById('oldPassword').value !== password) { alert('Current password is incorrect.'); return; }
  const p = document.getElementById('newPassword').value;
  if (p.length < 6) { alert('New password must be at least 6 characters.'); return; }
  password = p;
  localStorage.setItem('cafePassword', p);
  document.getElementById('oldPassword').value = '';
  document.getElementById('newPassword').value = '';
  alert('Password updated successfully.');
}

function menuLink() { return location.href.split('#')[0] + '#menu'; }
function makeQR() {
  const url = menuLink();
  document.getElementById('menuUrl').textContent = url;
  if (!/^https?:/.test(url)) { document.getElementById('qrArea').innerHTML = '<p class="muted">Host this page on GitHub Pages or another website to create a shareable QR code.</p>'; return; }
  const src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
  qrImage = src;
  document.getElementById('qrArea').innerHTML = `<img id="qrImage" src="${src}" alt="Cafe menu QR code">`;
}

function downloadQR() {
  if (!qrImage) { alert('Host this website online first to generate the QR code.'); return; }
  const a = document.createElement('a');
  a.href = qrImage;
  a.download = 'cafe-menu-qr.png';
  a.target = '_blank';
  a.click();
}

async function copyMenuLink() {
  try { await navigator.clipboard.writeText(menuLink()); alert('Menu link copied.'); }
  catch (e) { prompt('Copy your menu link:', menuLink()); }
}

function exportData() {
  const blob = new Blob([JSON.stringify({ foods, settings }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cafe-menu-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importData(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.foods) || !d.settings) throw Error();
      settings = d.settings;
      persistSettings();
      for (let item of d.foods) {
        delete item.id;
        await supabase.from('foods').insert([item]);
      }
      updateBrand();
      await fetchFoods();
      alert('Backup imported successfully to Supabase.');
    } catch (err) { alert('Invalid backup file.'); }
  };
  r.readAsText(f);
  e.target.value = '';
}

// Initial Run
document.getElementById('year').textContent = new Date().getFullYear();
updateBrand();
if (location.hash === '#admin') {
  openAdmin();
} else {
  showPage('menu');
}
fetchFoods();
</script>
